name: Generate Kids Shorts Script

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Story topic"
        required: false
        default: "Mintu tries to escape homework and gets caught by his mom"

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python agents/script_agent.py "${{ inputs.topic }}"

      - name: Commit generated script
        run: |
          git config user.name "Kids Shorts AI"
          git config user.email "actions@users.noreply.github.com"

          git add outputs/latest_script.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Generate new kids Shorts script"
            git push
          fi
