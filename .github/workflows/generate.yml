name: Generate Kids Shorts Script

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Story topic"
        required: false
        default: "Mintu tries to escape homework and gets caught by his mom"

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Generate script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python agents/script_agent.py "${{ inputs.topic }}"
      
      - name: Generate scene plan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python agents/scene_agent.py
      
      - name: Generate scene images
        run: |
          python agents/media_agent.py

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
            
      - name: Generate scene videos
        run: |
          python agents/video_agent.py
      
      - name: Commit generated files
        run: |
          git config user.name "Kids Shorts AI"
          git config user.email "actions@users.noreply.github.com"
      
          git add outputs/
      
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Generate complete AI episode"
            git push
          fi
